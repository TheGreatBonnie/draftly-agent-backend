app:
  name: Draftly
  environment: development
  debug: true
  version: 0.1.0
  host: 0.0.0.0
  port: 8000

database:
  url: postgresql://localhost:5432/draftly
  pool_min_size: 2
  pool_max_size: 10

strands:
  graph_id: draftly-main-graph
  session_storage_dir: .draftly/sessions
  max_node_executions: 10
  execution_timeout: 600
  node_timeout: 180
  review_policy: always

workers:
  enabled: true
  concurrency: 4

bedrock:
  region: us-east-1
  # Optional: custom endpoint for Bedrock
  # endpoint_url: https://bedrock-runtime.us-east-1.amazonaws.com
  # Optional: inference profile ARN for cross-region
  # inference_profile_arn: arn:aws:bedrock:...

mantle:
  # OpenAI-compatible endpoint on Bedrock
  endpoint_url: https://bedrock-mantle.us-east-1.api.aws/openai/v1
  # Optional: model overrides
  # reasoning_model: openai/gpt-5.6-luna
  # fast_model: openai/gpt-oss-120b-1:0