app:
  name: Draftly
  environment: production
  debug: false
  version: 0.1.0
  host: 0.0.0.0
  port: 8000

database:
  url: postgresql://localhost:5432/draftly
  pool_min_size: 2
  pool_max_size: 10

strands:
  graph_id: draftly-main-graph
  session_storage_dir: .draftly/sessions
  max_node_executions: 10
  execution_timeout: 600
  node_timeout: 180
  review_policy: always

workers:
  enabled: true
  concurrency: 4