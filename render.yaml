services:
  - type: keyvalue
    name: draftly-kv
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList:
      - source: 0.0.0.0/0
        description: modal-worker

  - type: web
    name: draftly-api
    runtime: docker
    region: oregon
    plan: 1c-2g
    branch: modal-deployment
    autoDeployTrigger: commit
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    # No `/bin/sh -c` wrapper and no `exec` prefix. Render passes dockerCommand
    # as a single argv token, so a nested shell wrapper arrives unsplit and
    # fails with status 127 ("<whole string>: not found"). `exec` is a shell
    # builtin, not a binary, so it must not be argv[0] either. uvicorn is on
    # PATH via the image's ENV PATH.
    # Use plain $PORT, not shell-default syntax: Render pre-substitutes a
    # dollar-brace variable before the container shell ever sees the command,
    # which mangles the default-value suffix into "10000:-10000}" and makes
    # uvicorn exit with "Invalid value for '--port'". Render always sets PORT
    # on a web service, so a shell default is unnecessary anyway.
    dockerCommand: uvicorn draftly.app.api.app:app --host 0.0.0.0 --port $PORT
    preDeployCommand: python scripts/bootstrap.py
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RQ_ENABLED
        value: "true"
      - key: STRANDS_SESSION_STORAGE
        value: database
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: draftly-kv
          property: connectionString
      - key: DRAFTLY_ENABLED_PROVIDERS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: REVIEW_DASHBOARD_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_SIGNING_SECRET
        sync: false
      # GITHUB_TOKEN is mandatory: build_integrations() constructs
      # GitHubClient unconditionally, and with no per-workflow installation id
      # at startup the client builds GitHubAuth(), which raises
      # "GITHUB_TOKEN is not configured." and the app exits before /health.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # The App private key is injected as PEM text, not as a file: nothing in
      # this image materialises /etc/secrets/github-app-private-key.pem, so
      # GITHUB_PRIVATE_KEY_PATH alone left generate_jwt() raising FileNotFoundError
      # and every GitHub App call returned HTTP 500. app_auth._load_private_key()
      # reads GITHUB_APP_PRIVATE_KEY first and falls back to the path.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
