# Real-PR override: drop the local authly checkout from the rq-worker so
# grounding resolves to `github` mode (installation token) instead of `local`.
#
# Usage (instead of the Part-1 docker worker):
#   docker compose -f docker-compose.redis.yml -f docker-compose.realpr.yml \
#     up -d --build rq-worker
#
# docker-compose.redis.yml:25 mounts `../authly` onto the default checkout root
# /tmp/repos/TheGreatBonnie/authly. The runner (`repo_checkout_for` +
# `resolve_grounding` in src/draftly/workflows/grounding.py) gives any present
# checkout priority over a linked GitHub installation, so with that mount the
# real GitHub PR flow grounds `local` on a stale base checkout. This override
# resets the worker's volumes to none, making `installation_id` (from the real
# webhook) win and switching evidence to the GitHub API.
#
# Requires Docker Compose v2.23+ (`!reset` merge tag); `config` verifies the
# merged file no longer contains the mount.

services:
  rq-worker:
    volumes: !reset []