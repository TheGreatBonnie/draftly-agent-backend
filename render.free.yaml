# Free-tier Blueprint ($0, no payment card).
#
# Differences from render.yaml:
#   - keyvalue + web run on the `free` plan
#   - draftly-kv accepts external connections so the Modal worker can reach it
#   - the `worker` service is REMOVED: Render has no free tier for
#     `type: worker`. The RQ worker runs as a scheduled burst function on Modal.
#   - `preDeployCommand` is ABSENT (it is present in render.yaml). Render
#     states the pre-deploy command is "available for paid web services,
#     private services, and background workers", so a free web service
#     silently ignores it and migrations would never run. Migrations run
#     from .github/workflows/migrate.yml instead.
#   - `persistenceMode` is ABSENT: free Key Value is in-memory only.
#
# Security note: ipAllowList 0.0.0.0/0 exposes the queue to the internet,
# protected only by the instance password. It holds queued job IDs only.
# Revert to [] after the demo if the worker moves to a static egress IP.

services:
  - type: keyvalue
    name: draftly-kv
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: modal-worker

  - type: web
    name: draftly-api
    runtime: docker
    region: oregon
    plan: free
    branch: modal-deployment
    autoDeployTrigger: commit
    dockerfilePath: ./docker/Dockerfile.render
    dockerContext: .
    # No `/bin/sh -c` wrapper and no `exec` prefix. Render passes dockerCommand
    # as a single argv token, so a nested shell wrapper arrives unsplit and
    # fails with status 127 ("<whole string>: not found"). `exec` is a shell
    # builtin, not a binary, so it must not be argv[0] either. uvicorn is on
    # PATH via the image's ENV PATH.
    # Use plain $PORT, not shell-default syntax: Render pre-substitutes a
    # dollar-brace variable before the container shell ever sees the command,
    # which mangles the default-value suffix into "10000:-10000}" and makes
    # uvicorn exit with "Invalid value for '--port'". Render always sets PORT
    # on a web service, so a shell default is unnecessary anyway.
    dockerCommand: uvicorn draftly.app.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # No maxShutdownDelaySeconds: Render rejects it for free tier services
    # ("max shutdown delay is not supported for free tier services"), even
    # though the Blueprint schema allows the key. Free services are killed on
    # Render's schedule rather than drained, so in-flight requests on a
    # spin-down or deploy can drop. Keep this on the paid render.yaml only.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RQ_ENABLED
        value: "true"
      - key: STRANDS_SESSION_STORAGE
        value: database
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: draftly-kv
          property: connectionString
      - key: DRAFTLY_ENABLED_PROVIDERS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: REVIEW_DASHBOARD_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_SIGNING_SECRET
        sync: false
      # GITHUB_TOKEN is mandatory, not optional: build_integrations() constructs
      # GitHubClient unconditionally, and with no per-workflow installation id
      # set at startup the client builds GitHubAuth(), which raises
      # "GITHUB_TOKEN is not configured." The app exits before serving /health.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Render injects PEM text as an environment value; this Blueprint does
      # not mount a secret file inside the container.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      # Provider credentials. The API process itself builds a ModelRouter at
      # startup (dependencies.build_models), so these are required on the web
      # service too -- not only on the Actions worker. Without them
      # create_model() raises "MANTLE_API_KEY is not configured." on the first
      # job that calls a model.
      - key: MANTLE_API_KEY
        sync: false
      - key: ORCAROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
